name: test

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# A new push to a pull request cancels the run for the head it replaced, since only the newest
# head's checks decide the merge. A push to dev or main is never cancelled: each merge keeps its
# own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # test.ps1's dotnet test does its own restore and build (no --no-build), so a separate
      # build step here would only recompile the same solution twice.
      # Windows PowerShell 5.1, the same shell the script is written for locally. The script
      # exits with the dotnet test exit code, so a red suite or a coverage gate under 100
      # percent fails this step.
      # The pillars' meta-rule: a rule that must hold with zero exceptions belongs in tooling,
      # not in an instruction file that asks nicely. This keeps AGENTS.md rules-only and under
      # its line limit, and keeps the decision log's phase section replaced rather than grown.
      - name: Instruction files stay rules, state stays in the decision log
        shell: powershell
        run: .\check-instruction-files.ps1

      # The same floor the pre-commit hook applies locally, on the range this run is about: no em
      # dash on an added line. A pull request compares against its base; a push to dev or main
      # compares against the first parent, which is the branch before the merge.
      - name: No em dash in the change
        shell: powershell
        run: |
          $range = if ($env:GITHUB_BASE_REF) { "origin/$($env:GITHUB_BASE_REF)...HEAD" } else { "HEAD^1..HEAD" }
          .\agent\hooks\pre-commit.ps1 -Range $range

      - name: Test with the coverage gate
        shell: powershell
        run: .\test.ps1

      # The run report tool is Python, so its tests and its strict type check run here too; a page
      # built from a run is only as trustworthy as the code that reads the run's files.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run report tool, strict types and tests
        shell: powershell
        working-directory: tools/run_report
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m mypy run_report tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m pytest -q
          exit $LASTEXITCODE

      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
